name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - "v*"
      - "commerce-ui-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Inspect package
        working-directory: frontend
        run: npm run pack:dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -U pip && python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check package version against tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          PACKAGE_VERSION=$(python - <<'PY'
          import runpy

          print(runpy.run_path("src/commercexl/_version.py")["__version__"])
          PY
          )
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "commercexl version (${PACKAGE_VERSION}) does not match tag (${TAG_VERSION})" >&2
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install -U pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Show release version
        run: echo "Publishing tag ${GITHUB_REF_NAME}"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-commerce-ui:
    name: Publish @orcestr/commerce-ui to npm
    if: startsWith(github.ref, 'refs/tags/commerce-ui-v')
    needs:
      - frontend
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check package version against tag
        working-directory: frontend
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#commerce-ui-v}"
          PACKAGE_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "@orcestr/commerce-ui version (${PACKAGE_VERSION}) does not match tag (${TAG_VERSION})" >&2
            exit 1
          fi

      - name: Publish package with provenance
        working-directory: frontend
        run: npm publish --workspace @orcestr/commerce-ui --access public --provenance

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "commercexl v${TAG_VERSION}" \
            --notes "PyPI: https://pypi.org/project/commercexl/${TAG_VERSION}/" \
            --generate-notes
